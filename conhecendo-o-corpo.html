<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conhecendo o Corpo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#e8f4ff;color:#12324a;overflow-x:hidden}
[hidden]{display:none!important}
.scr{display:none;padding:12px;flex-direction:column;align-items:center;gap:12px;max-width:560px;margin:0 auto;min-height:100vh}
.scr.on{display:flex}
button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 18px;min-height:56px;background:#1e6fd9;color:#fff;font-size:18px;width:100%;box-shadow:0 4px 0 #0c3f86;cursor:pointer}
button.alt{background:#fff;color:#12324a;box-shadow:0 4px 0 #9db8d4;border:2px solid #9db8d4}
button.sel{background:#ffb703;color:#12324a;box-shadow:0 4px 0 #b37d00;border-color:#b37d00}
button.sm{width:auto;min-height:48px;padding:8px 14px;font-size:16px}
button:active{transform:translateY(2px)}
h1{font-size:34px;margin:6px 0;text-align:center}h2{margin:4px 0;text-align:center}
.big{font-size:90px;line-height:1}.sub{text-align:center;font-size:18px;margin:0}
.card{background:#fff;border-radius:20px;padding:14px;width:100%;border:3px solid #bcd7f0}
.row{display:flex;gap:8px;width:100%;align-items:center;justify-content:space-between}
.grp{display:flex;gap:8px;width:100%}.grp button{font-size:15px;padding:10px 6px}
.r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #d6e6f5;font-size:17px}
.r b{text-align:right}
.bar{width:100%;height:14px;background:#fff;border-radius:9px;border:2px solid #9db8d4;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2a9d57;transition:width .5s}
#pt{font-weight:800;font-size:15px}
#msg{min-height:2.3em;font-size:20px;font-weight:800;text-align:center;color:#0c3f86}
.board{position:relative;height:min(56vh,520px);max-width:100%;background:#fff;border-radius:20px;border:3px solid #bcd7f0;--so:.18}
.base{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;isolation:isolate}.slot canvas{width:100%;height:100%;display:block}.slot:not(.empty){z-index:2}.slot.empty{z-index:1}.slot.empty canvas{image-rendering:auto}
.slot.empty canvas{filter:brightness(0);opacity:var(--so)}
.slot.empty.face-empty canvas{opacity:0;filter:none}
.slot.face-empty.pick{outline:2px dashed rgba(255,183,3,.85);outline-offset:-2px;border-radius:50%}
.slot.face-empty.hint{outline:3px solid #ffb703;outline-offset:-2px;border-radius:50%;animation:pul 1.4s ease-in-out infinite}
.slot.empty.pick canvas{filter:brightness(0) drop-shadow(0 0 5px #ffb703);opacity:.5}
.slot.hint canvas{filter:drop-shadow(0 0 6px #ffb703) drop-shadow(0 0 3px #ffb703);animation:pul 1.4s ease-in-out infinite}.slot.empty.hint canvas{filter:brightness(0) drop-shadow(0 0 6px #ffb703);opacity:.55}
.slot.ok{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.12)}}@keyframes pul{50%{opacity:.55}}.slot.ok canvas{filter:none;opacity:1}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.pc{width:76px;height:84px;background:#fff;border:3px solid #9db8d4;border-radius:14px;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;user-select:none;-webkit-user-select:none;text-align:center;line-height:1.1;cursor:grab}
.pc.sel{border-color:#ffb703;background:#fff3cd}
.pc canvas{width:54px;height:50px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}.pc canvas.puzzle-edge{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)) drop-shadow(0 0 0 rgba(255,255,255,.9))}.pc.drag{opacity:.35}
.fl{position:fixed;pointer-events:none;z-index:50;width:84px;height:84px;transform:translate(-50%,-70%)}
.fl canvas{width:100%;height:100%;object-fit:contain;transform:scale(1.15);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.opts{display:flex;flex-direction:column;gap:10px;width:100%}
button.hint{outline:4px solid #ffb703}button.good{background:#2a9d57;color:#fff;border-color:#2a9d57}
#fin{position:fixed;inset:0;background:rgba(18,50,74,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:60;overflow:hidden}
#fin.on{display:flex}#fin .card{display:flex;flex-direction:column;gap:10px;max-width:420px;text-align:center}
.cf{position:absolute;top:-20px;width:10px;height:14px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.rm *{animation:none!important;transition:none!important}

.menu-character{
  width:min(58vw,280px);
  height:min(58vh,390px);
  margin:0 auto 6px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  position:relative;
  isolation:isolate;
}
.menu-character::before{
  content:"";
  position:absolute;
  width:86%;
  height:86%;
  bottom:2%;
  border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),rgba(77,108,255,.08) 58%,transparent 72%);
  z-index:-1;
}
.menu-character img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  display:block;
  filter:drop-shadow(0 14px 20px rgba(0,0,0,.18));
  animation:menuFloat 3.2s ease-in-out infinite;
}
@keyframes menuFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-height:700px){.menu-character{height:44vh;width:min(52vw,230px)}}
</style></head><body>

<section class="scr on" id="home">
<div class="menu-character" id="menuCharacter" aria-hidden="true"></div><h1>CONHECENDO O CORPO</h1><p class="sub">Um jogo para descobrir o corpo humano</p>
<button data-go="lvls">COMEÇAR</button>
<button class="alt" data-go="how">COMO JOGAR</button>
</section>

<section class="scr" id="lvls"><h2>Escolha o nível</h2>
<button data-lv="0">1 · Conhecendo o corpo</button>
<button data-lv="1">2 · Monte o corpo</button>
<button data-lv="2">3 · Monte o rosto</button>
<button data-lv="3">4 · Direita e esquerda</button>
<button data-lv="4">5 · Desafio corporal</button>
<button class="alt sm" data-go="pro" style="margin-top:4px;opacity:.82">ÁREA DO PROFISSIONAL</button>
<button class="alt" data-go="home">← VOLTAR</button></section>

<section class="scr" id="how"><h2>Como jogar</h2>
<div class="card"><p style="font-size:20px;line-height:1.7;margin:0">1️⃣ Escolha uma peça<br>2️⃣ Arraste ou toque nela<br>3️⃣ Encontre o lugar certo<br>4️⃣ Monte o corpo!<br><br>👉 A direita e a esquerda são sempre do boneco.</p></div>
<button class="alt" data-go="home">← VOLTAR</button></section>

<section class="scr" id="pro"><h2>Modo profissional</h2>
<div class="card" id="ps"></div>
<button class="alt" id="rsess">ZERAR SESSÃO</button>
<button class="alt" data-go="home">← VOLTAR</button></section>

<section class="scr" id="game">
<div class="row"><button class="alt sm" data-go="lvls">← VOLTAR</button><b id="gt"></b><button class="alt sm" id="rs">↻ REINICIAR</button></div>
<div class="bar"><i id="pb"></i></div><div id="pt"></div>
<div id="msg" aria-live="polite"></div>
<div id="bd" class="board"></div>
<div id="tray" class="tray"></div><div id="opts" class="opts"></div>
</section>

<div id="fin"><div class="card"><div class="big">🎉</div><h2></h2><p class="sub"></p>
<button id="again">JOGAR NOVAMENTE</button><button id="next">PRÓXIMO NÍVEL</button><button class="alt" data-go="home">MENU</button></div></div>

function pcv(id,edge=false){const[x,y,w,h]=P[id].b,c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);const t=c.getContext('2d');const path=()=>{t.beginPath();P[id].pts.forEach((p,i)=>t[i?'lineTo':'moveTo'](p[0]-x,p[1]-y));t.closePath()};path();t.save();t.clip();t.drawImage(IMG,-x,-y,A.width,A.height);t.restore();if(edge){path();t.save();t.lineJoin='round';t.lineCap='round';t.strokeStyle='rgba(255,255,255,.92)';t.lineWidth=Math.max(2,Math.min(w,h)*.025);t.stroke();t.restore();c.className='puzzle-edge'}return c}

 /* Base limpa: cabeça e pescoço preenchidos com pele, sem buracos para os traços do rosto. */
 const g=t.createLinearGradient(350,100,660,560);g.addColorStop(0,'#ffd2ad');g.addColorStop(.58,'#fcb988');g.addColorStop(1,'#ee9a68');

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);

const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const S={snd:1,rm:matchMedia('(prefers-reduced-motion:reduce)').matches?1:0,dif:1,mode:0};
let st,cur,lv,pend,sel,ae,ph,fl,qs,qi,qa,Q,er,lock;
function newSession(){st={t0:Date.now(),h:0,n:0,lh:0,ln:0,miss:{},lvl:1}}newSession();

function rec(ok,name,lat){st.n++;if(ok)st.h++;else st.miss[name]=(st.miss[name]||0)+1;if(lat){st.ln++;if(ok)st.lh++}}
/* ===== ÁUDIO (Web Audio, sem arquivos) ===== */
let ac;function snd(f,d,tp,v){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sBtn=()=>snd(330,.06,'square',.05),sFit=()=>snd(440,.1,'triangle'),sBad=()=>snd(220,.18,'sine',.08);

const msg=t=>{$('#msg').textContent=t};

function paintPro(){const s=(Date.now()-st.t0)/1000|0,m=Object.entries(st.miss).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>cap(x[0])+' ('+x[1]+')').join(', ')||'Nenhuma ainda';
 $('#ps').innerHTML=[['TEMPO',pad(s/60|0)+':'+pad(s%60)],['ACERTOS',st.h],['TENTATIVAS',st.n],['APROVEITAMENTO',st.n?Math.round(st.h/st.n*100)+'%':'—'],['LATERALIDADE',st.lh+'/'+st.ln],['NÍVEL ALCANÇADO',st.lvl],['MAIOR DIFICULDADE',m]].map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
function conf(){if(S.rm)return;const c=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff'];for(let i=0;i<30;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${Math.random()*.8}s`;$('#fin').appendChild(e);setTimeout(()=>e.remove(),3600)}}

/* ===== TABULEIRO (peças em SVG independentes) ===== */
function board(fig,filled){const F=FIG[fig],b=$('#bd'),[cx,cy,cw,ch]=F.crop;curFig=F;b.innerHTML='';b.style.aspectRatio=cw+'/'+ch;b.style.setProperty('--so',[.3,.18,.05][S.dif]);

  d.style.cssText=`left:${(x-cx)/cw*100}%;top:${(y-cy)/ch*100}%;width:${w/cw*100}%;height:${h/ch*100}%`;d.appendChild(pcv(id));b.appendChild(d)})}
/* distância de um ponto ao polígono (0 = dentro) */
function dPoly(ps,px,py){let ins=false,d=1e9;for(let i=0,j=ps.length-1;i<ps.length;j=i++){const[ax,ay]=ps[i],[bx,by]=ps[j];if((ay>py)!=(by>py)&&px<(bx-ax)*(py-ay)/(by-ay)+ax)ins=!ins;
 const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l)):0;d=Math.min(d,Math.hypot(px-ax-t*dx,py-ay-t*dy))}return ins?0:d}
/* slot cujo contorno está sob o ponto (tolerância de 18px na tela) */
function slotAt(cx,cy,emptyOnly){const r=$('#bd').getBoundingClientRect(),[x0,y0,w,h]=curFig.crop,k=w/r.width,px=x0+(cx-r.left)*k,py=y0+(cy-r.top)*k,tol=18*k;let best=null,bd=1e9;
 $$('#bd .slot').forEach(s=>{if(emptyOnly&&!s.classList.contains('empty'))return;const p=P[s.dataset.id],d=dPoly(p.pts,px,py);if(d>tol)return;
  const sc=d*1000+Math.hypot(px-p.b[0]-p.b[2]/2,py-p.b[1]-p.b[3]/2);if(sc<bd){bd=sc;best=s}});return best}
