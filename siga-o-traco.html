<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siga o Traço</title>
<script src="ajustes.js"></script>
<link rel="stylesheet" href="ativamente-kit.css">
<style>
:root{--bg:#fff4fb;--bg2:#efe9ff;--pri:#b05cf0;--pri-esc:#8336c4;--sec:#ff6fa8;--ink:#3a2352;--muted:#7d6a93}
#jogo{height:100%;padding-bottom:12px}
.palco{flex:1;position:relative;background:#fffdf7;border-radius:28px;box-shadow:var(--sombra);overflow:hidden;min-height:300px;
  background-image:radial-gradient(#efe6d6 1.5px,transparent 1.5px);background-size:22px 22px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.aviso{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:1.1rem;margin:10px 0 0;color:var(--pri-esc)}
.aviso.err{color:var(--err)}
.ak-cartao svg{width:84px;height:84px}
.ak-cartao svg path{fill:none;stroke:var(--pri);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ak-cartao{min-height:160px}
</style>
</head>
<body>

<section class="tela on" id="inicio">
  <div class="ak-capa">
    <img class="ak-arte ak-arte-img" src="capa-siga-o-traco.webp" alt="">
    <h1 data-t="titulo">Siga o Traço</h1>
    <p data-t="sub">Leve a joaninha pela estrada até a estrela</p>
  </div>
  <div class="ak-rotulo" data-t="estrada">Largura da estrada</div>
  <div class="ak-seg" id="nivel">
    <button data-n="0" data-t="larga">Larga</button><button data-n="1" data-t="media">Média</button><button data-n="2" data-t="fina">Fina</button>
  </div>
  <div class="ak-rotulo" data-t="tracados">Traçados</div>
  <div class="ak-seg" id="cats">
    <button data-c="formas" data-t="formas">Formas</button><button data-c="mai" data-t="mai">ABC</button><button data-c="min" data-t="min">abc</button><button data-c="num" data-t="num">123</button>
  </div>
  <div class="ak-grade" id="formas"></div>
</section>

<section class="tela" id="jogo">
  <div class="ak-topo">
    <button class="ak-icone" id="btSair" aria-label="Menu">🏠</button>
    <h2 id="nome"></h2>
    <button class="ak-icone" id="btReinicia" aria-label="Recomeçar">↺</button>
  </div>
  <div class="palco" id="palco"><canvas id="tela"></canvas></div>
  <div class="aviso" id="aviso"></div>
</section>

FORMAS.forEach(f=>{ if(!f.cat) f.cat='formas';
  if(!f.nome){ const l=f.cat==='mai'?f.id:f.id.slice(4); f.nome=f.cat==='num'?{pt:'Número '+l,en:'Number '+l,es:'Número '+l}:{pt:'Letra '+l,en:'Letter '+l,es:'Letra '+l}; f.letra=l; } });
const salvo=AK.salvo('siga-o-traco'); let prog=salvo.ler(); if(prog.nivel==null) prog.nivel=0; if(!prog.cat) prog.cat='formas';
AK.traduzir(T); document.title=AK.t(T.titulo);
const $=id=>document.getElementById(id);

function preview(f){
  return `<svg viewBox="0 0 100 100">`+f.tr.map(s=>`<path d="M${s.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}"/>`).join('')+`</svg>`;
}
function daCat(){ return FORMAS.map((f,i)=>i).filter(i=>FORMAS[i].cat===prog.cat); }
function desenharInicio(){
  $('cats').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.c===prog.cat);b.onclick=()=>{prog.cat=b.dataset.c;salvo.gravar(prog);desenharInicio();};});
  $('formas').innerHTML=daCat().map(i=>{const f=FORMAS[i];return `<button class="ak-cartao" data-i="${i}">${preview(f)}<b>${AK.t(f.nome)}</b><span>${AK.estrelasHTML((prog.est||{})[f.id]||0)}</span></button>`;}).join('');
  $('formas').querySelectorAll('.ak-cartao').forEach(b=>b.onclick=()=>iniciar(+b.dataset.i));
  $('nivel').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.n===prog.nivel);b.onclick=()=>{prog.nivel=+b.dataset.n;salvo.gravar(prog);desenharInicio();};});

/* ---------- Jogo ---------- */
const cv=$('tela'), g=cv.getContext('2d');
const lapis=new Image(); lapis.src='lapis.webp';
let pauta=null, forma=null, idxForma=0, tracos=[], atualT=0, idx=0, tracando=false, saidas=0, W=0, H=0, tol=20, dedo=null, concluido=false;

function preparar(){
  const r=$('palco').getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const lado=Math.min(W,H), pad=lado*.1, esc=(lado-2*pad)/100, ox=(W-lado)/2+pad, oy=(H-lado)/2+pad;
  tol=lado*[.085,.062,.044][prog.nivel]; pauta={ox,oy,esc};
  // reamostra cada traço a cada ~3px
  tracos=forma.tr.map(s=>{
    const pts=s.map(p=>[ox+p[0]*esc,oy+p[1]*esc]), out=[pts[0]];
    for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.round(d/3));
      for(let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n]);}
    return out;
  });
  desenhar();
}
function caminho(pts,ate){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=ate;i++)g.lineTo(pts[i][0],pts[i][1]);}
/* setinhas (triângulos) ao longo da estrada, apontando o sentido do traço.
   Antes de começar elas deslizam devagar no sentido certo; vão sumindo onde a criança já passou. */
function setas(){
  const passo=Math.max(5,Math.round(tol*2.3/3)), s=tol*.44;
  const anda=idx===0&&!tracando?Math.floor(Date.now()/90)%passo:0;
  tracos.forEach((pts,t)=>{
    if(t<atualT) return;
    const ini=Math.round(tol*1.3/3)+(t===atualT?idx:0), fim=pts.length-1-Math.round(tol*1.3/3);
    g.fillStyle=t===atualT?'rgba(131,54,196,.75)':'rgba(176,150,230,.5)';
    for(let i=ini+((anda-ini)%passo+passo)%passo;i<fim;i+=passo){
      const a=pts[Math.max(0,i-2)], c=pts[Math.min(pts.length-1,i+2)], dx=c[0]-a[0], dy=c[1]-a[1], d=Math.hypot(dx,dy);
      if(d<.01) continue;
      const ux=dx/d, uy=dy/d, [x,y]=pts[i];
      g.beginPath(); g.moveTo(x+ux*s,y+uy*s);
      g.lineTo(x-ux*s*.7-uy*s*.8,y-uy*s*.7+ux*s*.8); g.lineTo(x-ux*s*.7+uy*s*.8,y-uy*s*.7-ux*s*.8);
      g.closePath(); g.fill();
    }
  });
}
function desenhar(){
  g.clearRect(0,0,W,H); g.lineCap='round'; g.lineJoin='round';
  if(forma.cat!=='formas'&&pauta){ // linhas do caderno: topo, meio e base
    const ys=forma.cat!=='min'?[[12,0],[50,1],[88,0]]:[[10,0],[42,1],[86,0]];
    ys.forEach(([y,trac])=>{ const yy=pauta.oy+y*pauta.esc; g.beginPath(); g.moveTo(8,yy); g.lineTo(W-8,yy);
      g.strokeStyle=y===(forma.cat!=='min'?88:86)?'#c9b8ea':'#e2d8f4'; g.lineWidth=2; g.setLineDash(trac?[10,10]:[]); g.stroke(); g.setLineDash([]); }); }
  tracos.forEach((pts,t)=>{
    caminho(pts,pts.length-1); g.strokeStyle=t===atualT?'#e9ddff':'#f1ebfb'; g.lineWidth=tol*2; g.stroke();
    caminho(pts,pts.length-1); g.setLineDash([2,12]); g.strokeStyle=t===atualT?'#b9a2ec':'#d9cdf3'; g.lineWidth=4; g.stroke(); g.setLineDash([]);
    if(t<atualT){caminho(pts,pts.length-1);g.strokeStyle='#ff6fa8';g.lineWidth=tol*.9;g.stroke();}
  });
  setas(); // triângulos mostrando o sentido de cada traço
  const pts=tracos[atualT]; if(!pts) return;
  if(idx>0){const grad=g.createLinearGradient(pts[0][0],pts[0][1],pts[idx][0],pts[idx][1]);grad.addColorStop(0,'#ff6fa8');grad.addColorStop(1,'#b05cf0');
    caminho(pts,idx);g.strokeStyle=grad;g.lineWidth=tol*.9;g.stroke();}
  // estrela no fim e bolinha verde no começo
  const [fx,fy]=pts[pts.length-1]; g.font=`${tol*1.5}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('⭐',fx,fy);
  if(idx===0){const [sx,sy]=pts[0]; const pulso=1+.12*Math.sin(Date.now()/180);
    g.beginPath();g.arc(sx,sy,tol*.75*pulso,0,2*P);g.fillStyle='#2fbf71';g.fill();
    g.fillStyle='#fff';g.font=`900 ${tol*.8}px sans-serif`;g.fillText(tracos.length>1?String(atualT+1):'',sx,sy+1);}
  const [bx,by]=pts[idx];
  if(forma.cat!=='formas'&&lapis.complete&&lapis.naturalWidth){ // letras e números: lápis com a ponta na estrada
    const lw=tol*2.7, lh=lw*lapis.naturalHeight/lapis.naturalWidth, solto=idx===0&&!tracando?tol*.55:0;
    g.drawImage(lapis,bx+solto,by-solto-lh,lw,lh);
  } else { g.font=`${tol*1.45}px sans-serif`; g.fillText('🐞',bx,idx===0&&!tracando?by-tol*1.55:by); }
}
function loop(){ if(AK.telaAtual==='jogo'&&!concluido){ if(idx===0) desenhar(); requestAnimationFrame(loop);} }
function ponto(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{
  if(concluido) return; const p=ponto(e), pts=tracos[atualT];
  if(Math.hypot(p[0]-pts[idx][0],p[1]-pts[idx][1])<tol*1.5){ tracando=true; cv.setPointerCapture(e.pointerId); aviso(T.siga); AK.som('clique'); mover(p);} 
});
cv.addEventListener('pointermove',e=>{ if(tracando) mover(ponto(e)); });
cv.addEventListener('pointerup',()=>{ tracando=false; });
cv.addEventListener('pointercancel',()=>{ tracando=false; });
function mover(p){
  const pts=tracos[atualT]; let melhor=-1, md=1e9;
  for(let j=idx;j<Math.min(idx+28,pts.length);j++){const d=Math.hypot(p[0]-pts[j][0],p[1]-pts[j][1]); if(d<md){md=d;melhor=j;}}
  if(md<tol){ if(melhor>idx){ if(Math.floor(melhor/25)>Math.floor(idx/25)) AK.som('tique'); idx=melhor; } }
  else if(Math.hypot(p[0]-pts[idx][0],p[1]-pts[idx][1])>tol*1.7){
    tracando=false; saidas++; AK.som('erro'); AK.vibrar(60); aviso(T.saiu,true);
  }
  if(idx>=pts.length-2){ tracando=false; idx=pts.length-1; desenhar();
    if(atualT<tracos.length-1){ atualT++; idx=0; AK.som('ok'); aviso(T.parte); }
    else { terminar(); return; } }
  desenhar();
}
function aviso(txt,err){ $('aviso').textContent=forma&&forma.cat!=='formas'?AK.t(txt).replace('🐞','✏️'):AK.t(txt); $('aviso').className='aviso'+(err?' err':''); }

function iniciar(i){
  idxForma=i; forma=FORMAS[i]; atualT=0; idx=0; saidas=0; concluido=false; tracando=false;
  $('nome').textContent=AK.t(forma.nome); AK.tela('jogo');
  requestAnimationFrame(()=>{ preparar(); aviso(T.comece); AK.falar(AK.t(T.comece).replace(/[^\p{L}\p{N}\s!.,]/gu,'')); loop(); });
}
function terminar(){
  concluido=true; desenhar(); AK.som('ok');
  const est=saidas===0?3:saidas<=2?2:1;
  prog.est=prog.est||{}; if(est>(prog.est[forma.id]||0)){prog.est[forma.id]=est;salvo.gravar(prog);}
  const botoes=[];
  const lista=FORMAS.map((f,i)=>i).filter(i=>FORMAS[i].cat===forma.cat), pos=lista.indexOf(idxForma);
  if(pos<lista.length-1) botoes.push({rotulo:AK.t(T.proximo),acao:()=>iniciar(lista[pos+1])});
  botoes.push({rotulo:AK.t(T.denovo),classe:'sec',acao:()=>iniciar(idxForma)});
  botoes.push({rotulo:AK.t(T.menu),classe:'sec',acao:voltarInicio});
  setTimeout(()=>AK.resultado({titulo:AK.t(T.fim),estrelas:est,texto:saidas===0?AK.t(T.perfeito):AK.t(T.fimTxt).replace('{N}',saidas),botoes}),350);
}
function voltarInicio(){ concluido=true; desenharInicio(); AK.tela('inicio'); }
$('btSair').onclick=voltarInicio;
$('btReinicia').onclick=()=>iniciar(idxForma);
window.addEventListener('resize',()=>{ if(AK.telaAtual==='jogo'&&forma){ const t=atualT,i=idx; preparar(); atualT=t; idx=Math.min(i,tracos[t].length-1); desenhar(); } });
AK.voltarInterno=()=>{ if(AK.telaAtual==='jogo'){voltarInicio();return true;} return false; };
desenharInicio(); AK.telaAtual='inicio';
})();
</script>
