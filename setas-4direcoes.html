<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Setas - 4 Direções</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;font-family:'Segoe UI',system-ui,sans-serif;background:#0b0f1a;color:#fff}
#app{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#1a2340,#0b0f1a 80%)}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:24px;text-align:center}
.screen.active{display:flex}
.titulo{font-size:clamp(28px,6vw,48px);font-weight:700;background:linear-gradient(135deg,#4c8dff,#3ddc97,#ffc93c,#ff5468);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.subtitulo{font-size:clamp(15px,2.4vw,20px);color:#8a92b4;max-width:480px;line-height:1.5;margin-bottom:30px}
.btn{font-size:clamp(18px,2.8vw,24px);font-weight:600;padding:16px 44px;border:0;border-radius:60px;background:linear-gradient(135deg,#4c8dff,#3ddc97);color:#0b0f1a;cursor:pointer;box-shadow:0 6px 0 #1f5a3e;transition:transform .1s,box-shadow .2s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f5a3e}
.cronometro{font-size:clamp(20px,3vw,28px);font-weight:700;background:#161b30;border:1px solid #ffffff14;border-radius:40px;padding:8px 28px;margin-bottom:36px;letter-spacing:1px}
.palco{position:relative;width:min(60vh,70vw,420px);height:min(60vh,70vw,420px);display:flex;align-items:center;justify-content:center}
.anel-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.anel-fundo{fill:none;stroke:#ffffff14;stroke-width:5}
.anel-progresso{fill:none;stroke:#4c8dff;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 8px #4c8dff80);transition:stroke .2s}
.seta-wrap{position:relative;z-index:2;width:62%;height:62%;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,1.1,.4,1)}
.seta-wrap svg{width:100%;height:100%;filter:drop-shadow(0 0 22px #4c8dff90)}
.seta-wrap.trocando{animation:pulso .35s ease}
@keyframes pulso{0%{transform:scale(.7) rotate(var(--rot))}60%{transform:scale(1.12) rotate(var(--rot))}100%{transform:scale(1) rotate(var(--rot))}}
.btn-sair{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff1f;background:#161b30;color:#8a92b4;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;z-index:5}
.btn-sair:active{transform:scale(.9);background:#1d2340}
.fim h2{font-size:clamp(30px,5vw,44px);margin-bottom:12px;color:#3ddc97}
.fim p{color:#8a92b4;font-size:18px;margin-bottom:30px}
.dificuldades{display:flex;flex-direction:column;gap:16px;width:100%;max-width:280px}
.btn-dif{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.btn-dif span{font-size:13px;font-weight:500;opacity:.75}
</style>
</head>
