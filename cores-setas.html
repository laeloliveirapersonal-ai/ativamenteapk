/* ===== LAYOUT NOVO — Cores & Setas ===== */
:root{
  --bg:#070b14;
  --panel:#111827;
  --panel2:#172033;
  --text:#f7f9ff;
  --muted:#8e9ab5;
  --line:rgba(255,255,255,.09);
}
html,body{
  background:var(--bg);
}
#app{
  background:
    radial-gradient(circle at 50% 0%,rgba(76,141,255,.18),transparent 34%),
    radial-gradient(circle at 0% 100%,rgba(61,220,151,.09),transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(255,84,104,.08),transparent 30%),
    #070b14;
}
.screen{
  padding:clamp(14px,2vw,28px);
}

/* MENU */
#screen-menu{
  position:relative;
  justify-content:center;
  gap:0;
}
#screen-menu:before{
  content:"";
  position:absolute;
  width:min(620px,85vw);
  height:min(620px,85vw);
  border-radius:50%;
  background:radial-gradient(circle,rgba(76,141,255,.09),transparent 68%);
  pointer-events:none;
}
#screen-menu > img{
  width:clamp(64px,8vw,92px)!important;
  height:clamp(64px,8vw,92px)!important;
  margin-bottom:12px!important;
  border:3px solid rgba(255,255,255,.12);
  box-shadow:0 14px 45px rgba(0,0,0,.45)!important;
  position:relative;
}
.titulo{
  font-size:clamp(38px,6vw,66px);
  line-height:1;
  letter-spacing:-2px;
  margin-bottom:12px;
  position:relative;
}
.subtitulo{
  max-width:560px;
  margin-bottom:20px;
  color:#aab4cc;
}
#screen-menu > div[style]{
  margin-top:4px;
  color:#687590!important;
  font-size:11px!important;
  letter-spacing:2px!important;
}
.dificuldades{
  gap:8px;
  margin:8px 0 18px;
}
.btn-dificuldade{
  min-width:118px;
  padding:11px 18px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
}
.btn-dificuldade.selecionado{
  transform:translateY(-2px);
}
.btn{
  min-width:260px;
  padding:15px 36px;
  border-radius:16px;
  margin:5px 0;
  box-shadow:0 7px 0 rgba(0,0,0,.28);
}
.btn.primario{
  box-shadow:0 7px 0 #164f42,0 0 30px rgba(61,220,151,.12);
}
.recorde{
  margin-top:18px;
  background:rgba(255,201,60,.07);
  border:1px solid rgba(255,201,60,.2);
  padding:9px 20px;
  font-size:14px;
}

/* INSTRUÇÕES / FIM */
.painel,.painel-fim{
  background:linear-gradient(145deg,rgba(23,32,51,.96),rgba(14,20,34,.96));
  border:1px solid var(--line);
  box-shadow:0 25px 70px rgba(0,0,0,.38);
  backdrop-filter:blur(16px);
}
.painel h2,.painel-fim h2{
  letter-spacing:-.5px;
}

/* JOGO */
#screen-jogo{
  padding:10px clamp(12px,2vw,28px);
  gap:clamp(12px,2vw,30px);
  background:
    radial-gradient(circle at 50% 50%,rgba(76,141,255,.055),transparent 38%);
}
#screen-jogo .lado{
  width:clamp(150px,18vw,240px);
  max-width:240px;
  min-width:150px;
  padding:12px;
  border-radius:26px;
  background:linear-gradient(145deg,rgba(23,32,51,.82),rgba(13,19,31,.82));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}
.legenda{
  width:100%;
  padding:9px 8px;
  border-radius:12px;
  background:rgba(255,255,255,.045);
  color:#b5bfd4;
  font-size:12px;
  letter-spacing:1.5px;
  text-align:center;
}
.grid-circulos{
  gap:14px;
  padding:8px 2px;
}
.circulo-resposta{
  width:clamp(62px,7vw,92px);
  max-width:none;
  border:4px solid rgba(255,255,255,.12);
  box-shadow:0 9px 20px rgba(0,0,0,.3);
}
.circulo-resposta:hover{
  transform:translateY(-3px) scale(1.04);
}
.area-central{
  gap:8px;
}
.hud{
  width:100%;
  max-width:650px;
  gap:8px;
  margin-bottom:4px;
  flex-wrap:nowrap;
}
.hud-item{
  flex:1;
  min-width:82px;
  padding:8px 10px;
  border-radius:14px;
  background:rgba(17,24,39,.88);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}
.hud-item .label{
  font-size:9px;
  color:#71809d;
  letter-spacing:1.2px;
}
.hud-item .value{
  font-size:clamp(18px,3vw,27px);
  line-height:1.15;
}
.btn-sair{
  flex:0 0 38px;
  width:38px;
  height:38px;
  background:rgba(255,84,104,.08);
  border-color:rgba(255,84,104,.2);
  color:#ff7c8b;
}
.anel-seta{
  width:min(58vh,46vw,430px);
  height:min(58vh,46vw,430px);
  margin:0 auto;
}
.anel-fundo{
  stroke:rgba(255,255,255,.08);
  stroke-width:5;
}
.anel-progresso{
  stroke-width:7;
  filter:drop-shadow(0 0 10px currentColor);
}
.seta-container{
  width:84%;
  height:40%;
}
.seta{
  font-size:clamp(20px,3.2vw,38px);
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}
.feedback-texto{
  top:0;
  font-size:clamp(25px,4vw,40px);
}

/* FIM */
.painel-fim{
  width:min(440px,94vw);
}
.stats{
  gap:10px;
}
.stat{
  padding:14px 8px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.05);
}
.fim-botoes{
  gap:8px;
}

/* TABLET / TELAS MENORES EM PAISAGEM */
@media (max-height:620px) and (orientation:landscape){
  #screen-jogo{padding:7px 12px}
  #screen-jogo .lado{padding:8px;width:clamp(135px,17vw,190px);min-width:135px}
  .grid-circulos{gap:9px}
  .circulo-resposta{width:clamp(52px,8vh,72px)}
  .anel-seta{width:min(62vh,42vw,330px);height:min(62vh,42vw,330px)}
  .hud-item{padding:5px 8px}
  .hud-item .label{font-size:8px}
  .hud-item .value{font-size:19px}
}

/* TELAS GRANDES */
@media (min-width:1100px) and (orientation:landscape){
  #screen-jogo{padding-left:3vw;padding-right:3vw}
  #screen-jogo .lado{width:clamp(190px,18vw,260px)}
  .circulo-resposta{width:clamp(78px,7vw,105px)}
}

/* REDUZ MOVIMENTO */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</style></head>
