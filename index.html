<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c1e">
<link rel="manifest" href="manifest.json">
<title>Ativamente - Jogos Educativos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #fdfcff;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --primary: #7c6fe0;
  --accent-green: #4fc3a1;
  --text-main: #2d2a4a;
  --text-muted: #77758f;
  --border-card: #e7e3f7;
  --radius-lg: 24px;
  --radius-md: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: var(--bg-dark); }
body {
  margin: 0;
  font-family: 'Nunito', 'Inter', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at 88% 12%, rgba(79,195,161,.10), transparent 28rem),
    radial-gradient(circle at 8% 32%, rgba(124,111,224,.10), transparent 32rem),
    #fdfcff;
  background-attachment: fixed;
  color: var(--text-main);
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 100vh;
}
header {
  padding: 1rem 1.2rem 1.15rem;
  position: sticky;
  top: 0;
  background: rgba(253,252,255,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 10;
  border-bottom: 1px solid rgba(124,111,224,.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 4px 24px rgba(45,42,74,.035);
}
.nav-top { width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: .8rem; }
.brand-logo {
  width: min(176px, 62vw);
  height: auto;
  max-width: 62vw;
  object-fit: contain;
  filter: drop-shadow(0 5px 10px rgba(45,42,74,.08));
}
.search-box { position: relative; width: 100%; max-width: 720px; }
.search-box span {
  position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
  color: #8b87a6; font-size: .9rem; pointer-events: none;
}
#busca {
  width: 100%;
  padding: .85rem 1rem .85rem 2.6rem;
  border-radius: 999px;
  border: 1px solid #e7e3f7;
  background: #fff;
  color: var(--text-main);
  font-size: .95rem;
  outline: none;
  box-shadow: 0 4px 16px rgba(45,42,74,.035);
  transition: border-color .2s, box-shadow .2s;
}
#busca::placeholder { color: #9b98af; }
#busca:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124,111,224,.12); }
.hero-banner {
  margin: 1.2rem 1.2rem 1.5rem;
  padding: 1.6rem 1.45rem;
  background: linear-gradient(135deg, #f0edff 0%, #fbfaff 58%, #e9faf5 100%);
  border: 1px solid #e6e1fa;
  border-radius: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(80,67,150,.07);
}
.hero-banner::after {
  content: '🧠';
  position: absolute;
  right: 1rem;
  bottom: .3rem;
  font-size: clamp(3.2rem, 12vw, 5rem);
  opacity: .16;
  filter: none;
  pointer-events: none;
}
.hero-title { font-size: clamp(1.65rem, 5vw, 2.25rem); font-weight: 900; line-height: 1.15; margin: 0 0 .65rem; letter-spacing: -.035em; color: #2d2a4a; }
.hero-title span { color: #7c6fe0; display: block; }
.hero-desc { font-size: .95rem; color: #6f6b89; margin: 0; max-width: 78%; line-height: 1.55; }
#lista {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  padding: 0 1.2rem 2.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
.card {
  background: rgba(255,255,255,.96);
  border-radius: 22px;
  padding: .8rem;
  cursor: pointer;
  border: 1px solid #e9e5f7;
  box-shadow: 0 6px 22px rgba(45,42,74,.055);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 220px;
  position: relative;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  user-select: none;
  overflow: hidden;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(45,42,74,.10); border-color: #d7d0f5; }
.card:active { transform: scale(.985); }
.card:focus-visible { outline: 3px solid rgba(124,111,224,.55); outline-offset: 3px; }
.logo-wrap {
  width: 100%;
  aspect-ratio: 1.21 / 1;
  border-radius: 16px;
  overflow: hidden;
  background: #f2efff;
  box-shadow: none;
  border: 1px solid #eeeafb;
}
.logo-game { width: 100%; height: 100%; display: block; object-fit: cover; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: .55rem; padding: .8rem .15rem .1rem; }
.card-info { min-width: 0; }
.card-info .nome { font-weight: 800; font-size: .94rem; margin-bottom: .25rem; color: #302d4e; line-height: 1.25; }
.card-info .desc { font-size: .74rem; color: #77758f; line-height: 1.4; }
.arrow-btn {
  width: 34px; height: 34px; min-width: 34px; border-radius: 50%;
  background: #7c6fe0; display: flex; align-items: center;
  justify-content: center; font-size: .8rem; color: #fff;
  box-shadow: 0 4px 10px rgba(124,111,224,.20);
}
#player {
  position: fixed; inset: 0; background: #fdfcff; display: none;
  flex-direction: column; z-index: 100;
}
#player.aberto { display: flex; }
#player header {
  display: flex; flex-direction: row; align-items: center; gap: 1rem;
  padding: .8rem 1rem; background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e7e3f7; box-shadow: 0 4px 16px rgba(45,42,74,.04);
}
#voltar {
  background: #f0edff; border: 1px solid #e3defa; color: #5146a8;
  width: 40px; height: 40px; border-radius: 14px; font-size: 1.2rem;
  cursor: pointer; flex-shrink: 0;
}
#voltar:active { background: #e3defa; }
#tituloJogo { font-weight: 800; font-size: 1rem; color: #302d4e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#frame { flex: 1; width: 100%; border: 0; background: #fff; }
@media (min-width: 700px) {
  header { padding-left: max(1.2rem, calc((100vw - 1120px) / 2)); padding-right: max(1.2rem, calc((100vw - 1120px) / 2)); }
  .nav-top { margin-bottom: .9rem; }
  .brand-logo { width: 190px; }
  .hero-banner { max-width: 1120px; margin: 1.6rem auto 1.8rem; padding: 2.4rem 2.6rem; }
  .hero-desc { max-width: 60%; font-size: 1rem; }
  #lista { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; padding-left: 1.2rem; padding-right: 1.2rem; }
  .card { min-height: 260px; padding: 1rem; }
  .card-info .nome { font-size: 1rem; }
  .card-info .desc { font-size: .8rem; }
}
@media (min-width: 1050px) { #lista { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 380px) {
  .brand-logo { width: 150px; max-width: 65vw; }
  .hero-banner { margin: .9rem .8rem 1.1rem; padding: 1.2rem; }
  .hero-title { font-size: 1.5rem; }
  .hero-desc { font-size: .82rem; max-width: 82%; }
  #lista { gap: .7rem; padding-left: .8rem; padding-right: .8rem; }
  .card { padding: .6rem; min-height: 195px; border-radius: 18px; }
  .logo-wrap { border-radius: 13px; }
  .card-bottom { gap: .35rem; padding-top: .65rem; }
  .card-info .nome { font-size: .82rem; }
  .card-info .desc { font-size: .66rem; }
  .arrow-btn { width: 28px; height: 28px; min-width: 28px; }
}
