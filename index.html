<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c1e">
<link rel="manifest" href="manifest.json">
<title>Ativamente - Jogos Educativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #070c1e;
    --bg-card: rgba(15, 23, 42, 0.7);
    --bg-input: rgba(15, 23, 42, 0.8);
    --primary: #00f2fe;
    --accent-green: #00e676;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --border-card: rgba(255, 255, 255, 0.08);
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 80% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 10% 60%, rgba(123, 31, 162, 0.15) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text-main);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  /* Header com Logo Centralizada (sem botões) */
  header {
    padding: 1.5rem 1.2rem 1rem;
    position: sticky; top: 0;
    background: rgba(7, 12, 30, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nav-top {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 1rem;
  }

  .brand-logo {
    height: 190px;
    max-width: 90%;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3));
  }

  /* Busca */
  .search-box {
    position: relative;
    width: 100%;
  }

  .search-box span {
    position: absolute;
    left: 1rem; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  #busca {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.6rem;
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 0.9rem;
    outline: none;
  }

  #busca:focus {
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
  }

  /* Hero Section */
  .hero-banner {
    margin: 1.2rem;
    padding: 1.5rem;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(11, 26, 59, 0.6) 100%);
    border: 1px solid rgba(0, 242, 254, 0.2);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .hero-banner::after {
    content: '🧠';
    position: absolute;
    right: -10px; bottom: -10px;
    font-size: 5.5rem;
    opacity: 0.25;
    filter: drop-shadow(0 0 15px var(--primary));
  }

  .hero-title {
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1.2;
    margin: 0 0 0.5rem;
  }

  .hero-title span {
    color: var(--accent-green);
    display: block;
  }

  .hero-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0;
    max-width: 75%;
    line-height: 1.4;
  }

  /* Grid de Jogos */
  #lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem;
    padding: 0 1.2rem 2rem;
  }

  /* Estilos dos Cards */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 1.1rem;
    cursor: pointer;
    border: 1px solid var(--border-card);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 160px;
    position: relative;
    transition: all 0.2s ease;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.8rem;
  }

  .icon-box {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }

  .card[data-id="trava-letras"] .icon-box { background: linear-gradient(135deg, #00c6ff, #0072ff); }
  .card[data-id="termo-solo"] .icon-box { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .card[data-id="termo-duel"] .icon-box { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
  .card[data-id="cores-setas"] .icon-box { background: linear-gradient(135deg, #FF416C, #FF4B2B); }
  .card[data-id="setas-4direcoes"] .icon-box { background: linear-gradient(135deg, #00F2FE, #4FACFE); }
  .card[data-id="genius-square"] .icon-box { background: linear-gradient(135deg, #F7971E, #FFD200); }

  .card[data-id="setas-4direcoes"] {
    border-color: rgba(0, 242, 254, 0.8);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
  }

  .arrow-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .card-info .nome {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 0.3rem;
    color: var(--text-main);
  }

  .card-info .desc {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.3;
  }

  /* Player Modal */
  #player {
    position: fixed; inset: 0;
    background: var(--bg-dark);
    display: none; flex-direction: column;
    z-index: 100;
  }
  
  #player.aberto { display: flex; }
  
  #player header {
    display: flex; align-items: center; gap: 1rem;
    padding: .8rem 1rem;
    background: #0f172a;
    border-bottom: 1px solid var(--border-card);
  }

  #voltar {
    background: rgba(255, 255, 255, 0.1); 
    border: 0; color: #fff;
    width: 38px; height: 38px; 
    border-radius: 10px;
    font-size: 1.1rem; cursor: pointer;
  }

  #tituloJogo { font-weight: 700; font-size: 1rem; }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<header>
  <div class="nav-top">
    <img src="logo.png" alt="Ativamente" class="brand-logo">
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input id="busca" type="search" placeholder="Buscar jogo educativo...">
  </div>
</header>

<main>
  <div class="hero-banner">
    <h1 class="hero-title">Desperte seu <span>Potencial</span></h1>
    <p class="hero-desc">Escolha um jogo abaixo para começar a treinar a mente!</p>
  </div>

  <div id="lista"></div>
</main>

<div id="player">
  <header>
    <button id="voltar">←</button>
    <span id="tituloJogo"></span>
  </header>
  <iframe id="frame" allowfullscreen></iframe>
</div>

<script>
const BASE = window.location.pathname.replace(/\/[^\/]*$/, '/');

const JOGOS = [
  {
    id: 'trava-letras',
    nome: 'Trava Letras',
    emoji: 'abc',
    desc: 'Diga palavras por categoria antes do tempo acabar',
    arquivo: 'trava-letras.html'
  },
  {
    id: 'termo-solo',
    nome: 'Termo Solo',
    emoji: 'T',
    desc: 'Descubra a palavra de 5 letras',
    arquivo: 'termo-solo.html'
  },
  {
    id: 'termo-duel',
    nome: 'Termo Duel',
    emoji: '⚔️',
    desc: 'Duelo de palavras entre 2 jogadores',
    arquivo: 'termo-duel.html'
  },
  {
    id: 'cores-setas',
    nome: 'Cores & Setas',
    emoji: '🌈',
    desc: 'Toque no círculo da cor certa — reflexo e atenção',
    arquivo: 'cores-setas.html'
  },
  {
    id: 'setas-4direcoes',
    nome: 'Setas 4 Direções',
    emoji: '✢',
    desc: 'Acompanhe a seta por 2 minutos — foco e ritmo',
    arquivo: 'setas-4direcoes.html'
  },
  {
    id: 'genius-square',
    nome: 'Genius Square',
    emoji: '🧩',
    desc: 'Encaixe as 9 peças sem sobrepor os bloqueadores',
    arquivo: 'genius-square.html'
  }
];

const lista = document.getElementById('lista');
const busca = document.getElementById('busca');
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const tituloJogo = document.getElementById('tituloJogo');

function renderizar(filtro = '') {
  const termo = filtro.toLowerCase().trim();
  const filtrados = JOGOS.filter(j => j.nome.toLowerCase().includes(termo) || j.desc.toLowerCase().includes(termo));

  if (!filtrados.length) {
    lista.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:2rem;">Nenhum jogo encontrado</div>';
    return;
  }

  lista.innerHTML = filtrados.map(j => `
    <div class="card" data-id="${j.id}">
      <div class="card-top">
        <div class="icon-box">${j.emoji}</div>
        <div class="arrow-btn">❯</div>
      </div>
      <div class="card-info">
        <div class="nome">${j.nome}</div>
        <div class="desc">${j.desc}</div>
      </div>
    </div>
  `).join('');
}

lista.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const jogo = JOGOS.find(j => j.id === card.dataset.id);
  if (!jogo) return;

  tituloJogo.textContent = jogo.nome;
  frame.src = BASE + jogo.arquivo;
  player.classList.add('aberto');
});

document.getElementById('voltar').addEventListener('click', () => {
  player.classList.remove('aberto');
  frame.src = '';
});

busca.addEventListener('input', e => renderizar(e.target.value));

renderizar();
</script>
</body>
</html>
